name: Voida
options:
  bundleIdPrefix: dev.voida
  deploymentTarget:
    macOS: "14.0"
packages:
  VoidaEngine:
    path: ../VoidaEngine
targets:
  Voida:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: VoidaEngine
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.voida.app
        CODE_SIGN_IDENTITY: "-"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Voida
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "14.0"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Adobe Illustrator Document
            CFBundleTypeRole: Editor
            LSItemContentTypes: [com.adobe.illustrator]
            LSHandlerRank: Alternate
            NSDocumentClass: Voida.VoidaDocument
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.adobe.illustrator
            UTTypeDescription: Adobe Illustrator Document
            UTTypeConformsTo: [com.adobe.pdf]
            UTTypeTagSpecification:
              public.filename-extension: [ai]
schemes:
  Voida:
    build:
      targets:
        Voida: all
    run:
      config: Debug
